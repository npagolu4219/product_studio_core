<div class="psc-shell" [class.prompt-mode]="homeMode" [class.psc-rail-expanded]="!railCollapsed && viewport === 'desktop'" [attr.data-viewport]="viewport">
  <!-- Mobile top bar -->
  <header class="psc-topbar" *ngIf="viewport === 'mobile'">
    <button type="button" class="psc-topbar-btn" (click)="toggleNav()" [attr.aria-expanded]="navOpen" aria-controls="psc-rail" aria-label="Open navigation">
      <lucide-icon name="menu" [size]="20"></lucide-icon>
    </button>
    <button type="button" class="psc-topbar-brand" (click)="navigate('home')" aria-label="Product Studio home">
      <span class="psc-rail-logo-icon-wrap"><lucide-icon name="zap" [size]="15" color="white"></lucide-icon></span>
      <span>Product Studio</span>
    </button>
    <span class="psc-topbar-spacer"></span>
    <button type="button" class="psc-topbar-btn" (click)="openCmd()" aria-label="Search">
      <lucide-icon name="search" [size]="19"></lucide-icon>
    </button>
    <button type="button" class="psc-topbar-btn" (click)="toggleNotifications()" aria-label="Notifications">
      <lucide-icon name="bell" [size]="19"></lucide-icon>
      <span class="psc-topbar-dot" *ngIf="unreadCount > 0"></span>
    </button>
  </header>

  <!-- Rail Nav (sidebar on desktop, icon rail on tablet, drawer on mobile) -->
  <nav class="psc-rail" id="psc-rail" [class.collapsed]="railCollapsed" [class.open]="navOpen" aria-label="Product Studio">
    <div class="psc-rail-top">
      <button type="button" class="psc-rail-logo" (click)="railCollapsed ? toggleNav() : navigate('home')"
        [attr.aria-label]="railCollapsed ? 'Expand navigation' : 'Dashboard'" [title]="railCollapsed ? 'Expand navigation' : 'Dashboard'">
        <span class="psc-rail-logo-icon-wrap"><lucide-icon name="zap" [size]="16" color="white"></lucide-icon></span>
        <span class="psc-rail-logo-text">Product Studio</span>
      </button>
      <button type="button" class="psc-rail-collapse-btn" *ngIf="!railCollapsed" (click)="toggleNav()"
        [attr.aria-label]="viewport === 'desktop' ? 'Collapse navigation' : 'Close navigation'" [title]="viewport === 'desktop' ? 'Collapse' : 'Close'">
        <lucide-icon [name]="viewport === 'desktop' ? 'chevron-left' : 'x'" [size]="16"></lucide-icon>
      </button>
    </div>

    <!-- Section 1: primary destinations + More -->
    <div class="psc-rail-items psc-rail-section" role="list">
      <button type="button" class="psc-rail-item" role="listitem" *ngFor="let item of mainNavItems" [attr.data-tour]="'nav-' + item.route" [class.active]="activeRoute === item.route"
        [attr.aria-current]="activeRoute === item.route ? 'page' : null" (click)="navigate(item.route)"
        [attr.title]="railCollapsed ? item.label : null" [attr.aria-label]="item.label">
        <lucide-icon [name]="item.icon" [size]="20"></lucide-icon>
        <span class="psc-rail-label">{{ item.label }}</span>
        <span class="psc-rail-badge" *ngIf="item.route === 'jobs' && runningJobsCount > 0">{{ runningJobsCount }}</span>
      </button>

      <button type="button" class="psc-rail-item psc-rail-more" role="listitem" (click)="toggleMore()" [class.has-active]="moreActive && !moreOpen"
        [attr.aria-expanded]="moreOpen" aria-controls="psc-rail-more-items" [attr.title]="railCollapsed ? (moreOpen ? 'Less' : 'More') : null">
        <lucide-icon [name]="moreOpen ? 'chevron-up' : 'ellipsis'" [size]="20"></lucide-icon>
        <span class="psc-rail-label">{{ moreOpen ? 'Less' : 'More' }}</span>
        <span class="psc-rail-badge" *ngIf="!moreOpen && runningJobsCount > 0" [attr.aria-label]="runningJobsCount + ' running jobs'">{{ runningJobsCount }}</span>
      </button>
      <div class="psc-rail-more-items" id="psc-rail-more-items" *ngIf="moreOpen">
        <button type="button" class="psc-rail-item psc-rail-item--sub" role="listitem" *ngFor="let item of moreNavItems" [class.active]="activeRoute === item.route"
          [attr.aria-current]="activeRoute === item.route ? 'page' : null" (click)="navigate(item.route)"
          [attr.title]="railCollapsed ? item.label : null" [attr.aria-label]="item.label">
          <lucide-icon [name]="item.icon" [size]="18"></lucide-icon>
          <span class="psc-rail-label">{{ item.label }}</span>
          <span class="psc-rail-badge" *ngIf="item.route === 'jobs' && runningJobsCount > 0">{{ runningJobsCount }}</span>
        </button>
      </div>
    </div>

    <div class="psc-rail-spacer"></div>

    <div class="psc-rail-bottom">
      <button type="button" class="psc-rail-item" (click)="toggleNotifications()"
        [attr.title]="railCollapsed ? 'Notifications' : null" aria-label="Notifications">
        <lucide-icon name="bell" [size]="20"></lucide-icon>
        <span class="psc-rail-label">Notifications</span>
        <span class="psc-rail-badge unread" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
      </button>
      <!-- Profile: opens Settings (theme, colours, search) -->
      <button type="button" class="psc-rail-user" (click)="toggleSettings($event)" aria-haspopup="menu" [attr.aria-expanded]="settingsOpen"
        aria-controls="psc-settings-menu" [attr.aria-label]="user.name + ', settings'" [attr.title]="railCollapsed ? 'Settings' : null">
        <span class="psc-rail-avatar">{{ user.initials }}</span>
        <span class="psc-rail-user-info">
          <span class="psc-rail-user-name">{{ user.name }}</span>
          <span class="psc-rail-user-role">{{ user.role }}</span>
        </span>
        <lucide-icon class="psc-rail-user-cog" name="settings" [size]="16" aria-hidden="true"></lucide-icon>
      </button>
    </div>
  </nav>

  <!-- Backdrop for tablet/mobile drawers -->
  <div class="psc-scrim" *ngIf="scrimVisible" (click)="closeDrawers()" aria-hidden="true"></div>

  <!-- Main Content -->
  <main class="psc-main">
    <router-outlet></router-outlet>
  </main>

  <!-- First-time product tours (Home and project workspace) -->
  <app-psc-tour></app-psc-tour>

  <!-- Notification Panel -->
  <div class="psc-notification-panel" [class.open]="notificationsOpen" role="dialog" aria-label="Notifications" [attr.aria-hidden]="!notificationsOpen">
    <div class="psc-notif-header">
      <h3>Notifications</h3>
      <div class="psc-notif-actions">
        <button type="button" class="psc-btn psc-btn-ghost psc-btn-sm" (click)="markAllRead()">Mark all read</button>
        <button type="button" class="psc-btn psc-btn-icon" (click)="toggleNotifications()" aria-label="Close notifications">
          <lucide-icon name="x" [size]="16"></lucide-icon>
        </button>
      </div>
    </div>
    <div class="psc-notif-list">
      <div class="psc-notif-item" *ngFor="let n of notifications" [class.unread]="!n.read" (click)="handleNotification(n)">
        <div class="psc-notif-icon" [ngClass]="'type-' + n.type">
          <lucide-icon *ngIf="n.type === 'ai'" name="bot" [size]="16"></lucide-icon>
          <lucide-icon *ngIf="n.type === 'success'" name="check-circle" [size]="16"></lucide-icon>
          <lucide-icon *ngIf="n.type === 'warning'" name="alert-triangle" [size]="16"></lucide-icon>
          <lucide-icon *ngIf="n.type === 'error'" name="x-circle" [size]="16"></lucide-icon>
          <lucide-icon *ngIf="n.type === 'info'" name="info" [size]="16"></lucide-icon>
        </div>
        <div class="psc-notif-content">
          <div class="psc-notif-title">{{ n.title }}</div>
          <div class="psc-notif-msg">{{ n.message }}</div>
          <div class="psc-notif-time">{{ n.timestamp | date:'MMM d, h:mm a' }}</div>
          <button type="button" class="psc-btn psc-btn-ghost psc-btn-sm" *ngIf="n.actionLabel" (click)="$event.stopPropagation(); handleNotificationAction(n)">{{ n.actionLabel }}</button>
        </div>
        <div class="psc-notif-dot" *ngIf="!n.read"></div>
      </div>
    </div>
  </div>
  <div class="psc-overlay" *ngIf="notificationsOpen" (click)="toggleNotifications()"></div>

  <!-- Appearance (theme mode + custom colours) -->
  <app-psc-theme-customizer *ngIf="appearanceOpen" (closed)="appearanceOpen = false"></app-psc-theme-customizer>

  <!-- Command Palette (⌘K / Ctrl+K) -->
  <div class="cmd-overlay" *ngIf="cmdOpen" (click)="closeCmd()" aria-hidden="true"></div>
  <div class="cmd-palette" [class.open]="cmdOpen" role="dialog" aria-modal="true" aria-label="Command palette" [attr.aria-hidden]="!cmdOpen">
    <div class="cmd-search-row">
      <lucide-icon name="search" [size]="16" class="cmd-search-icon"></lucide-icon>
      <input #cmdInput class="cmd-input" [(ngModel)]="cmdQuery" (input)="onCmdInput()" (keydown)="onCmdKeydown($event)"
        placeholder="Search chats, pages, or create an artifact…" autocomplete="off" aria-label="Search"
        role="combobox" aria-controls="cmd-results" [attr.aria-expanded]="cmdOpen"
        [attr.aria-activedescendant]="cmdResults.length ? 'cmd-result-' + cmdActiveIndex : null" />
      <button type="button" class="cmd-esc" (click)="closeCmd()">Esc</button>
    </div>
    <div class="cmd-results" id="cmd-results" role="listbox">
      <ng-container *ngFor="let r of cmdResults; let i = index">
        <div class="cmd-group-label" *ngIf="showGroupLabel(i)">{{ r.group }}</div>
        <button type="button" class="cmd-result" [id]="'cmd-result-' + i" role="option" [attr.aria-selected]="i === cmdActiveIndex"
          [class.active]="i === cmdActiveIndex" (mouseenter)="cmdActiveIndex = i" (click)="runCmd(r)">
          <div class="cmd-result-icon"><lucide-icon [name]="r.icon" [size]="14"></lucide-icon></div>
          <div class="cmd-result-copy">
            <span class="cmd-result-label">{{ r.label }}</span>
            <span class="cmd-result-desc">{{ r.desc }}</span>
          </div>
          <lucide-icon name="arrow-right" [size]="12" class="cmd-result-arrow"></lucide-icon>
        </button>
      </ng-container>
      <div class="cmd-empty" *ngIf="cmdResults.length === 0">No results for “{{ cmdQuery }}”</div>
    </div>
    <div class="cmd-footer">
      <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
      <span><kbd>Enter</kbd> open</span>
      <span><kbd>Esc</kbd> close</span>
    </div>
  </div>
</div>

<!-- Settings (from the profile in the nav): theme, colours, search -->
<div class="psc-settings-menu" id="psc-settings-menu" *ngIf="settingsOpen && settingsPos as pos" role="menu" aria-label="Settings"
  [style.left.px]="pos.x" [style.bottom.px]="pos.bottom" (click)="$event.stopPropagation()" (keydown.escape)="closeSettings(true)">
  <div class="psc-settings-head">
    <span class="psc-rail-avatar">{{ user.initials }}</span>
    <span class="psc-settings-who"><strong>{{ user.name }}</strong><small>{{ user.role }}</small></span>
  </div>
  <div class="psc-settings-label"><lucide-icon name="settings" [size]="12"></lucide-icon>Settings</div>
  <div class="psc-settings-row">
    <span class="psc-settings-row-label">Theme</span>
    <div class="psc-theme-switch" role="radiogroup" aria-label="Theme">
      <button type="button" class="psc-theme-option" *ngFor="let o of themeOptions" role="radio"
        [attr.aria-checked]="theme.mode() === o.id" [class.active]="theme.mode() === o.id"
        (click)="setTheme(o.id)" [title]="o.id === 'system' ? 'System — follows your OS live' : o.label + ' theme'">
        <lucide-icon [name]="o.icon" [size]="14"></lucide-icon>
        <span>{{ o.label }}</span>
      </button>
    </div>
  </div>
  <button type="button" role="menuitem" class="psc-settings-item" (click)="closeSettings(); openAppearance()">
    <span class="psc-theme-palette-dot" [style.background]="'linear-gradient(135deg,' + theme.activeColors().primary + ',' + theme.activeColors().secondary + ')'"></span>
    <span class="psc-settings-item-label">Customize colours</span>
  </button>
  <button type="button" role="menuitem" class="psc-settings-item" (click)="closeSettings(); openCmd()">
    <lucide-icon name="search" [size]="15"></lucide-icon>
    <span class="psc-settings-item-label">Search</span>
    <kbd *ngIf="viewport === 'desktop'">⌘K</kbd>
  </button>
</div>

<!-- Feedback after moving a chat (with Undo) -->
<div class="psc-organizer-toast" *ngIf="organizer.notice() as n" role="status" aria-live="polite">
  <lucide-icon name="folder-check" [size]="15"></lucide-icon>
  <span>{{ n.text }}</span>
  <button type="button" *ngIf="n.undo" (click)="n.undo!()">Undo</button>
  <button type="button" class="psc-organizer-x" (click)="organizer.dismiss()" aria-label="Dismiss"><lucide-icon name="x" [size]="13"></lucide-icon></button>
</div>

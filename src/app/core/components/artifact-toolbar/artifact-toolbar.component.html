<div class="tb" *ngIf="canvas.artifact() as artifact" role="toolbar" aria-label="Artifact actions">
  <button type="button" class="tb-icon" (click)="canvas.toggleChatCollapsed()"
    [title]="canvas.layout().chatCollapsed ? 'Show conversation' : 'Hide conversation (focus mode)'"
    [attr.aria-label]="canvas.layout().chatCollapsed ? 'Show conversation' : 'Hide conversation'">
    <lucide-icon [name]="canvas.layout().chatCollapsed ? 'panel-left-open' : 'panel-left-close'" [size]="16"></lucide-icon>
  </button>

  <!-- The preview's only header: document title (rename in place) and its version -->
  <div class="tb-doc" data-tour="pv-doc">
    <input *ngIf="renaming(); else titleTpl" class="tb-title-input" [value]="artifact.title" aria-label="Document title" maxlength="120"
      (keydown.enter)="finishRename($any($event.target).value, true)" (keydown.escape)="$event.stopPropagation(); finishRename('', false)"
      (blur)="finishRename($any($event.target).value, true)" />
    <ng-template #titleTpl>
      <h1 class="tb-doc-title" [title]="artifact.title">{{ artifact.title }}</h1>
      <button type="button" class="tb-rename" *ngIf="!canvas.viewingVersion()" (click)="startRename()" aria-label="Rename document" title="Rename">
        <lucide-icon name="pencil" [size]="12"></lucide-icon>
      </button>
    </ng-template>
    <span class="tb-doc-ver" [title]="canvas.viewingVersion() ? 'Viewing an earlier version' : 'Current version'">v{{ canvas.viewingVersion() ?? artifact.version }}</span>
  </div>

  <!-- Back to the document from edit / compare / history / share / publish / export -->
  <button type="button" class="tb-btn tb-back" *ngIf="isAway()" (click)="setMode('view')" title="Back to the document (Esc)">
    <lucide-icon name="arrow-left" [size]="14"></lucide-icon><span class="tb-label">Document</span>
  </button>

  <span class="tb-spacer"></span>

  <!-- History (versions) -->
  <button type="button" class="tb-btn" data-tour="pv-modes" [class.active]="canvas.mode() === 'history'" [attr.aria-pressed]="canvas.mode() === 'history'"
    (click)="toggleHistory()" title="Version history">
    <lucide-icon name="history" [size]="14"></lucide-icon><span class="tb-label">History</span>
    <span class="tb-count" *ngIf="canvas.versions().length > 1">{{ canvas.versions().length }}</span>
  </button>
  <button type="button" class="tb-btn tb-btn--primary" [class.done]="artifact.status === 'published'" (click)="setMode('publish')"
    [title]="artifact.status === 'published' ? 'Published — manage' : 'Publish to your team'">
    <lucide-icon [name]="artifact.status === 'published' ? 'badge-check' : 'send'" [size]="14"></lucide-icon>
    <span class="tb-label">{{ artifact.status === 'published' ? 'Published' : 'Publish' }}</span>
  </button>


  <button type="button" class="tb-icon" (click)="close()" title="Close (Esc)" aria-label="Close artifact">
    <lucide-icon name="x" [size]="16"></lucide-icon>
  </button>

  <div class="tb-progress" *ngIf="canvas.generating()" role="progressbar" aria-label="AI is updating this chat" [attr.aria-valuenow]="canvas.generationProgress()">
    <div class="tb-progress-bar" [style.width]="canvas.generationProgress() + '%'"></div>
  </div>
</div>
